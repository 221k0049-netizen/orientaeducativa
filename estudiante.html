<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="NAIMA OS · CONALEP — Portal del Estudiante">
<meta name="theme-color" content="#F4F1EA">
<title>NAIMA OS · Espacio del Estudiante — CONALEP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>
  // Protección de ruta inmediata: verificar que la ventana cuente con sesión de estudiante
  (function(){
    try {
      var raw = sessionStorage.getItem('naima_os_session_auth');
      if (!raw) {
        window.location.replace('index.html');
        return;
      }
      var s = JSON.parse(raw);
      if (!s || s.rol !== 'estudiante') {
        window.location.replace('index.html');
        return;
      }
    } catch(e) {
      window.location.replace('index.html');
    }
  })();
</script>
</head>
<body class="student-portal-body">

<!-- ===================== SIDEBAR ===================== -->
<aside class="sidebar" id="sidebar" role="navigation" aria-label="Navegación del estudiante">
  <div class="brand-block">
    <div class="brand-logos">
      <span class="brand-edu"><span class="gov"></span>Educación</span>
      <span class="brand-sep">|</span>
      <span class="brand-conalep">conalep</span>
    </div>
    <h2>Espacio del Alumno</h2>
    <span class="os">NAIMA OS · BIENESTAR</span>
  </div>

  <div class="user-profile-block" id="userProfileBlock"><!-- generado por estudiante.js --></div>

  <nav class="navlist" id="navlist"><!-- generado por estudiante.js --></nav>

  <div class="side-foot" id="sideFoot">
    <div class="side-foot-text"><span class="spark" style="color:var(--green);">✦</span>Tu bienestar importa siempre.</div>
  </div>
</aside>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebarMobile()"></div>
<button class="menu-toggle" onclick="toggleSidebarMobile()" aria-label="Abrir menú">☰</button>

<!-- ===================== CONTENIDO PRINCIPAL ===================== -->
<main class="main">
  <!-- Barra superior del estudiante -->
  <div class="admin-top-nav student-top-nav">
    <div class="atn-left">
      <span class="atn-badge student-atn-badge">🎓 PORTAL ESTUDIANTIL</span>
      <span class="atn-user" id="studentHeaderUser">Alumno CONALEP</span>
    </div>
    <div class="atn-actions">
      <button type="button" onclick="logoutUser()" class="btn-top-logout" style="background:transparent;border:none;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:4px;" title="Cerrar sesión de forma segura">
        Cerrar sesión ⎋
      </button>
    </div>
  </div>

  <div class="content" id="content"><!-- generado por estudiante.js --></div>
</main>

<!-- ===================== MODAL ===================== -->
<div class="modal-overlay" id="appModal" role="dialog" aria-modal="true">
  <div class="modal-box" id="appModalBody"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="supabase.js"></script>
<script src="db.js"></script>
<script src="estudiante.js"></script>
</body>
</html>
